services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - resolveai_data:/var/lib/resolveai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  init:
    build: .
    profiles: ["init"]
    env_file: .env
    command: ["python", "-m", "scripts.init_data"]
    volumes:
      - resolveai_data:/var/lib/resolveai
  backup:
    build: .
    env_file: .env
    command: ["python", "-m", "scripts.backup", "--loop"]
    volumes:
      - resolveai_data:/var/lib/resolveai
    restart: unless-stopped
volumes:
  resolveai_data:
