<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savani CSKH · Đăng nhập</title><link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
<main class="login-card">
  <p class="eyebrow">SAVANI · ResolveAI</p><h1>Đăng nhập nhân viên</h1>
  <p class="muted">Chỉ nhân viên CSKH được phép xem hội thoại, Ticket và tài liệu nội bộ.</p>
  <form id="loginForm"><label>Tên đăng nhập<input id="username" autocomplete="username" required></label>
  <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
  <p id="error" class="login-error" hidden></p><button class="primary" type="submit">Đăng nhập</button></form>
</main><script src="login.js"></script>
</body></html>
