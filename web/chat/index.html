<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savani - Hỗ trợ khách hàng</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<main class="chat">
  <header>
    <div class="who-head"><span class="av" aria-hidden="true">S</span>
      <div><div class="title">Savani · Trợ lý CSKH</div><div id="status" class="status" aria-live="polite"></div></div></div>
    <button id="close" class="close" type="button" aria-label="Đóng chat" hidden>&times;</button>
  </header>
  <p class="privacy">Cuộc trò chuyện được lưu để hỗ trợ bạn. Vui lòng không gửi mật khẩu hay số thẻ ngân hàng.</p>
  <div id="log" class="log" role="log" aria-live="polite"></div>
  <div id="chips" class="chips"></div>
  <div id="banner" class="banner" hidden></div>
  <form id="form" class="composer" autocomplete="off">
    <input id="input" type="text" maxlength="1000" placeholder="Nhập tin nhắn..." aria-label="Tin nhắn">
    <button id="send" type="submit">Gửi</button>
  </form>
  <button id="finish" class="finish" hidden type="button">Kết thúc cuộc trò chuyện</button>
  <button id="restart" class="restart" hidden type="button">Bắt đầu cuộc trò chuyện mới</button>
</main>
<script src="chat.js"></script>
</body>
</html>
